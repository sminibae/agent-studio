services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: agent_studio
      POSTGRES_USER: agent_studio
      POSTGRES_PASSWORD: agent_studio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_studio -d agent_studio"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
